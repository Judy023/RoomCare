<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#233E35">
  <title>Offline · RoomCare</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #FAF9F6; color: #233E35; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    main { max-width: 26rem; margin: 1rem; padding: 2.5rem 2rem; text-align: center; background: #fff; border: 1px solid #DEDFD7; border-radius: 1.5rem; box-shadow: 0 6px 20px -10px rgba(35,62,53,.12); }
    img { width: 64px; height: 64px; }
    h1 { margin: 1rem 0 .5rem; font-family: Fraunces, Georgia, serif; font-size: 1.6rem; }
    p { margin: 0 0 1.5rem; color: #45584E; line-height: 1.6; font-size: .95rem; }
    button { padding: .7rem 1.4rem; border: 1px solid #233E35; border-radius: .5rem; background: #233E35; color: #fff; font: 600 .9rem inherit; cursor: pointer; }
    button:hover { background: #365446; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>RoomCare needs a connection to show live room status. Check your internet and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
